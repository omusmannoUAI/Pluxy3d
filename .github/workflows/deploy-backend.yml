name: Deploy Pluxy3d Backend

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Pluxy3dBE/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: windows-latest
    env:
      DOTNET_VERSION: '9.0.x'
      AZURE_WEBAPP_NAME_BACKEND: ${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}
      AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
      AZUREAPPSERVICE_PUBLISHPROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: Pluxy3dBE
        run: dotnet restore

      - name: Build
        working-directory: Pluxy3dBE
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        working-directory: Pluxy3dBE
        run: dotnet publish --configuration Release --no-build -o ${{ runner.temp }}\publish

      - name: Validate deploy inputs
        shell: pwsh
        run: |
          if (-not "$env:AZURE_WEBAPP_NAME_BACKEND") {
            Write-Error "AZURE_WEBAPP_NAME_BACKEND is empty. Set the App Service name in repo secrets."
          }
          if (-not "$env:AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND" -and -not "$env:AZUREAPPSERVICE_PUBLISHPROFILE" -and -not "$env:AZURE_CREDENTIALS") {
            Write-Error "No deploy credentials found. Set AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND or AZUREAPPSERVICE_PUBLISHPROFILE (recommended), or AZURE_CREDENTIALS (service principal JSON)."
          }

      - name: Deploy to Azure Web App (Publish Profile - Backend Secret)
        id: deploy_pp_backend
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND != '' }}
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_BACKEND }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          package: ${{ runner.temp }}\publish

      - name: Deploy to Azure Web App (Publish Profile - AppService Secret)
        id: deploy_pp_appservice
        if: ${{ env.AZUREAPPSERVICE_PUBLISHPROFILE != '' }}
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_BACKEND }}
          publish-profile: ${{ env.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ${{ runner.temp }}\publish

      - name: Azure Login (service principal) - fallback
        id: azure_login
        if: ${{ env.AZURE_CREDENTIALS != '' && ( (env.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND == '' && env.AZUREAPPSERVICE_PUBLISHPROFILE == '') || (steps.deploy_pp_backend.outcome == 'failure') || (steps.deploy_pp_appservice.outcome == 'failure') ) }}
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (Logged-in Context)
        if: ${{ steps.azure_login.outcome == 'success' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_BACKEND }}
          package: ${{ runner.temp }}\publish

      - name: Fail if no deploy path succeeded
        if: ${{ (steps.deploy_pp_backend.outcome != 'success') && (steps.deploy_pp_appservice.outcome != 'success') && (steps.azure_login.outcome != 'success') }}
        shell: pwsh
        run: |
          Write-Error "Deployment did not run or failed. Ensure the publish profile is valid (and SCM Basic Auth is enabled) or provide AZURE_CREDENTIALS for service principal login."
