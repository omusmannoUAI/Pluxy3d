name: Deploy Pluxy3d Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Pluxy3dBE/**'
      - 'Pluxy3dBE.Domain/**'
      - 'Pluxy3dBE.DomainContracts/**'
      - 'Pluxy3dBE.DalContracts/**'
      - 'Pluxy3dBE.Repository/**'
      - 'Pluxy3dBE.Entities/**'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    name: Build and Deploy Backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: Pluxy3dBE
        run: dotnet restore

      - name: Build
        working-directory: Pluxy3dBE
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        working-directory: Pluxy3dBE
        run: dotnet publish --configuration Release --no-build --output ../publish

      - name: Verify publish output
        shell: pwsh
        run: |
          Write-Host "Contents of publish directory:"
          if (Test-Path "./publish") {
            Get-ChildItem "./publish" -Recurse | Select-Object Name, Length | Format-Table -AutoSize
          } else {
            Write-Error "Publish directory not found"
            exit 1
          }

      - name: Verify publish profile exists
        shell: pwsh
        run: |
          $publishProfile = "${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}"
          if ([string]::IsNullOrEmpty($publishProfile)) {
            Write-Error "AZUREAPPSERVICE_PUBLISHPROFILE secret is not configured"
            exit 1
          } else {
            Write-Host "✅ Publish profile secret is configured (length: $($publishProfile.Length) characters)"
          }

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pluxy3d-api-prod'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: './publish'
