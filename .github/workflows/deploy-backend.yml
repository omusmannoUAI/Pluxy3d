name: Deploy Pluxy3d Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Pluxy3dBE/**'
      - 'Pluxy3dBE.Domain/**'
      - 'Pluxy3dBE.DomainContracts/**'
      - 'Pluxy3dBE.DalContracts/**'
      - 'Pluxy3dBE.Repository/**'
      - 'Pluxy3dBE.Entities/**'

# Prevent concurrent backend deployments
concurrency:
  group: backend-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    name: Build and Deploy Backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: Pluxy3dBE
        run: dotnet restore

      - name: Build
        working-directory: Pluxy3dBE
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        working-directory: Pluxy3dBE
        run: dotnet publish --configuration Release --no-build --output ../publish

      - name: Verify publish output
        shell: pwsh
        run: |
          Write-Host "Contents of publish directory:"
          if (Test-Path "./publish") {
            Get-ChildItem "./publish" -Recurse | Select-Object Name, Length | Format-Table -AutoSize
            Write-Host "`nChecking for main executable:"
            if (Test-Path "./publish/Pluxy3dBE.exe") {
              Write-Host "✅ Main executable found: Pluxy3dBE.exe"
            } else {
              Write-Host "❌ Main executable NOT found"
              exit 1
            }
            Write-Host "`nChecking for configuration files:"
            Get-ChildItem "./publish" -Filter "*.json" | Select-Object Name
          } else {
            Write-Error "Publish directory not found"
            exit 1
          }

      - name: Verify publish profile exists
        shell: pwsh
        run: |
          Write-Host "🔍 Checking publish profile secret availability..."
          if ([string]::IsNullOrEmpty("${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}")) {
            Write-Error "❌ AZUREAPPSERVICE_PUBLISHPROFILE secret is not configured"
            exit 1
          }
          Write-Host "✅ Publish profile secret is available"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pluxy3d-api-prod-d9h2f3gpf8cmcqd9'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: './publish'
