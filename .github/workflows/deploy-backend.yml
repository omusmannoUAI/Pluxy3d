name: Deploy Pluxy3d Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Pluxy3dBE/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: windows-latest
    env:
      DOTNET_VERSION: '9.0.x'
      AZURE_WEBAPP_NAME_BACKEND: ${{ secrets.AZURE_WEBAPP_NAME_BACKEND }}
      AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
  AZUREAPPSERVICE_PUBLISHPROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: Pluxy3dBE
        run: dotnet restore

      - name: Build
        working-directory: Pluxy3dBE
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        working-directory: Pluxy3dBE
        run: dotnet publish --configuration Release --no-build -o ${{ runner.temp }}\publish

      - name: Validate deploy credentials
        shell: pwsh
        run: |
          if (-not "$env:AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND" -and -not "$env:AZUREAPPSERVICE_PUBLISHPROFILE" -and -not "$env:AZURE_CREDENTIALS") {
            Write-Error "No deploy credentials found. Configure secret AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND or AZUREAPPSERVICE_PUBLISHPROFILE (recommended), or AZURE_CREDENTIALS (service principal JSON)."
          }

      - name: Azure Login (service principal) - optional
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND == '' && env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (Publish Profile)
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND != '' || env.AZUREAPPSERVICE_PUBLISHPROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_BACKEND }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND != '' && env.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND || env.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: ${{ runner.temp }}\publish

      - name: Deploy to Azure Web App (Logged-in Context)
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND == '' && env.AZURE_CREDENTIALS != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_BACKEND }}
          package: ${{ runner.temp }}\publish
