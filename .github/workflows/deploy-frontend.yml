name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      # Use a repository secret to avoid committing sensitive backend URL to the repo
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - name: Verify NEXT_PUBLIC_API_URL secret
        run: |
          node -e "const v=process.env.NEXT_PUBLIC_API_URL; if (!v) { console.error('NEXT_PUBLIC_API_URL MISSING'); process.exit(1); } if (/localhost/i.test(v)) { console.error('NEXT_PUBLIC_API_URL appears to be a localhost URL — refusing to build'); process.exit(2); } console.log('NEXT_PUBLIC_API_URL is set and looks valid');"
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./pluxy3d"
          app_build_command: "npm install --legacy-peer-deps && npm run build"
        # Note: the job-level env provides NEXT_PUBLIC_API_URL to the build step

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "close"
          app_location: "./pluxy3d"
